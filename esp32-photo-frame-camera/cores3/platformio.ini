; CoreS3 — camera / sender firmware
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 1500000
; Avoid RTS hard-reset after upload — it USB-re-enumerates and drops usbipd attach in WSL.
upload_flags =
    --after
    no_reset
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -mfix-esp32-psram-cache-issue
    -Iinclude
lib_deps =
    m5stack/M5Unified@^0.2.0
    https://github.com/m5stack/M5CoreS3.git
    bblanchon/ArduinoJson@^7.0.0
    ; Phase 4: m5stack/M5Module-LLM

build_src_filter =
    +<*>
    -<.git/>
    -<.svn/>

[env:M5CoreS3]
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_flags =
    ${env.build_flags}
    -DM5CORES3
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
upload_speed = 115200
